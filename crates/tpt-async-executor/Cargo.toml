[package]
name        = "tpt-async-executor"
description = "Optional single-threaded cooperative executor for tpt-async"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
readme        = "README.md"
keywords      = ["async", "executor", "runtime"]
categories    = ["asynchronous"]
workspace   = "../.."

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Emits a `tracing` span around each task poll and a trace event on spawn.
tracing = ["dep:tracing"]

[dependencies]
tpt-async-core = { workspace = true, features = ["alloc"] }
tracing        = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
tokio     = { version = "1", features = ["rt", "macros"] }

[[bench]]
name = "executor"
harness = false
