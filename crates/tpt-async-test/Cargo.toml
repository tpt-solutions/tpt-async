[package]
name        = "tpt-async-test"
description = "Deterministic testing utilities for the tpt-async stack — fake clocks and fake I/O pairs"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
readme        = "../../README.md"
keywords      = ["async", "testing", "no_std", "mock"]
categories    = ["asynchronous", "development-tools::testing"]
workspace   = "../.."

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tpt-async-timer = { workspace = true, default-features = false }
tpt-async-io    = { workspace = true }

[dev-dependencies]
tpt-async-core = { workspace = true }
