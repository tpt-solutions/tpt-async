name: Bug report
description: Report a problem with the tpt-async stack
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include a minimal reproduction if possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: crate
    attributes:
      label: Which crate?
      options:
        - tpt-async (facade)
        - tpt-async-core
        - tpt-async-executor
        - tpt-async-timer
        - tpt-async-io
        - tpt-async-macros
        - tpt-net-tls
        - tpt-net-http
        - tpt-net-ws
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. 0.1.0 or commit hash
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target
      description: e.g. x86_64-unknown-linux-gnu, thumbv7em-none-eabihf, wasm32-unknown-unknown
    validations:
      required: true
