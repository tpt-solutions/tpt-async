[alias]
# Build the no_std check targets. The bare-metal targets have no std, so the
# std-flavoured default features of core/timer must be switched off here.
check-embedded = "build --target thumbv7em-none-eabihf --no-default-features -p tpt-async-core -p tpt-async-timer"
check-riscv    = "build --target riscv32imac-unknown-none-elf --no-default-features -p tpt-async-core -p tpt-async-timer"
check-wasm     = "build --target wasm32-unknown-unknown -p tpt-async-core -p tpt-async-timer -p tpt-async-executor"
check-all      = "clippy --workspace --all-features -- -D warnings"
