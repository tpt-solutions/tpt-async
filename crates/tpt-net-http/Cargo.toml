[package]
name        = "tpt-net-http"
description = "Minimal spec-compliant HTTP/1.1 client/server with zero-copy header parsing for tpt-async"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
readme        = "../../README.md"
keywords      = ["http", "client", "server", "async"]
categories    = ["network-programming", "web-programming::http-client", "web-programming::http-server"]
workspace   = "../.."

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tpt-async-core   = { workspace = true }
tpt-async-io     = { workspace = true }
tpt-async-timer  = { workspace = true }
tpt-net-tls      = { workspace = true }
rustls           = { workspace = true, features = ["ring", "std"] }

[dev-dependencies]
tokio     = { version = "1", features = ["full"] }
tpt-async-io = { workspace = true, features = ["tokio"] }
rcgen     = { workspace = true }
criterion = { workspace = true }
