[workspace]
members = [
    "crates/tpt-async-core",
    "crates/tpt-async-macros",
    "crates/tpt-async-executor",
    "crates/tpt-async-timer",
    "crates/tpt-async-io",
    "crates/tpt-net-tls",
    "crates/tpt-net-http",
    "crates/tpt-net-ws",
    "crates/tpt-async",
]
resolver = "2"

[workspace.package]
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.75"
license       = "MIT OR Apache-2.0"
authors       = ["TPT Solutions <opensource@tpt.solutions>"]
homepage      = "https://github.com/tpt-solutions/tpt-async"
repository    = "https://github.com/tpt-solutions/tpt-async"
documentation = "https://docs.rs/tpt-async"
keywords      = ["async", "no_std", "embedded", "networking", "runtime-agnostic"]
categories    = ["asynchronous", "embedded", "network-programming", "no-std"]

[workspace.dependencies]
# ── internal ──────────────────────────────────────────────────────────────────
tpt-async-core     = { path = "crates/tpt-async-core",     version = "0.1.0" }
tpt-async-macros   = { path = "crates/tpt-async-macros",   version = "0.1.0" }
tpt-async-executor = { path = "crates/tpt-async-executor", version = "0.1.0" }
tpt-async-timer    = { path = "crates/tpt-async-timer",    version = "0.1.0" }
tpt-async-io       = { path = "crates/tpt-async-io",       version = "0.1.0" }
tpt-net-tls        = { path = "crates/tpt-net-tls",        version = "0.1.0" }
tpt-net-http       = { path = "crates/tpt-net-http",       version = "0.1.0" }
tpt-net-ws         = { path = "crates/tpt-net-ws",         version = "0.1.0" }

# ── external ──────────────────────────────────────────────────────────────────
rustls             = { version = "0.23", default-features = false }
rustls-native-certs = "0.8"
webpki-roots       = "0.26"
rustls-pemfile     = "2"
rcgen              = { version = "0.13", default-features = false }
spin               = { version = "0.9", default-features = false, features = ["mutex", "once"] }
proc-macro2        = "1"
quote              = "1"
syn                = { version = "2", features = ["full"] }
criterion          = { version = "0.5", features = ["html_reports"] }
trybuild           = "1"
