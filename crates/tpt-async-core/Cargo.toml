[package]
name          = "tpt-async-core"
description   = "Executor-agnostic Future traits, Waker abstractions, and zero-cost state-machine helpers for tpt-async"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
readme        = "../../README.md"
keywords      = ["async", "no_std", "embedded", "futures"]
categories    = ["asynchronous", "embedded", "no-std"]
workspace     = "../.."

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["alloc"]
alloc   = []          # enables JoinHandle and heap-backed shared state
std     = ["alloc"]   # enables std::error::Error impl on error types

[dependencies]
spin = { workspace = true }

[dev-dependencies]
# nothing beyond std for unit tests
