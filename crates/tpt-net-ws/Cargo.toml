[package]
name        = "tpt-net-ws"
description = "Pure-Rust WebSocket (RFC 6455) framing, masking, and ping/pong management for tpt-async"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
readme        = "../../README.md"
keywords      = ["websocket", "async", "network"]
categories    = ["network-programming", "web-programming::websocket"]
workspace   = "../.."

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tpt-async-core  = { workspace = true }
tpt-async-io    = { workspace = true }
tpt-async-timer = { workspace = true }
tpt-net-http    = { workspace = true }
sha1            = "0.10"
getrandom       = { version = "0.2", features = ["js"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tpt-async-io = { workspace = true, features = ["tokio"] }
rcgen = { workspace = true }
