[package]
name        = "wasm-example"
description = "WASM browser example for the tpt-async timer stack (wasm32-unknown-unknown)"
version       = "0.1.0"
edition       = "2021"
rust-version  = "1.75"
license       = "MIT OR Apache-2.0"
authors       = ["TPT Solutions <opensource@tpt.solutions>"]
repository    = "https://github.com/tpt-solutions/tpt-async"
publish       = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-async-timer = { path = "../../crates/tpt-async-timer", default-features = false }
wasm-bindgen    = "0.2"
js-sys          = "0.3"
