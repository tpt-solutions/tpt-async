[package]
name        = "tpt-net-http"
description = "Minimal spec-compliant HTTP/1.1 client/server with zero-copy header parsing for tpt-async"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
authors       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
documentation = { workspace = true }
readme        = "../../README.md"
keywords      = ["http", "client", "server", "async"]
categories    = ["network-programming", "web-programming::http-client", "web-programming::http-server"]
workspace   = "../.."

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
http2 = ["dep:h2", "dep:http", "dep:bytes", "dep:tokio"]
fuzz = []

[dependencies]
tpt-async-core   = { workspace = true }
tpt-async-io     = { workspace = true }
tpt-async-timer  = { workspace = true }
tpt-net-tls      = { workspace = true }
rustls           = { workspace = true, features = ["ring", "std"] }
h2               = { version = "0.4", optional = true }
http             = { version = "1", optional = true }
bytes            = { version = "1", optional = true }
tokio            = { version = "1", features = ["rt", "net", "sync", "macros"], optional = true }

[dev-dependencies]
tokio     = { version = "1", features = ["full"] }
h2        = { version = "0.4", features = ["stream"] }
tpt-async-io = { workspace = true, features = ["tokio"] }
hyper        = { version = "1", features = ["http1", "client", "server"] }
http-body-util = "0.1"
hyper-util   = { version = "0.1", features = ["tokio"] }
bytes        = "1"
ureq         = "2"
rcgen     = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "http"
harness = false
