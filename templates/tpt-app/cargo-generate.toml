[template]
description = "A ready-to-hack binary project on the tpt-async runtime-agnostic async stack"
include = ["Cargo.toml", "src/*", "README.md", ".gitignore"]

[placeholders]
description = { type = "string", prompt = "Project description?", default = "A tpt-async application" }
variant = { type = "string", prompt = "Profile? (desktop | embedded | wasm)", default = "desktop", choices = ["desktop", "embedded", "wasm"] }

