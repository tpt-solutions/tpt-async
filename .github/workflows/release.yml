name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Verify the workspace is green before publishing anything.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf,riscv32imac-unknown-none-elf,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - run: cargo clippy --workspace --all-features -- -D warnings
      - run: cargo check-embedded && cargo check-riscv && cargo check-wasm

  # Publish in dependency order; --dry-run first so a packaging error fails
  # before anything is uploaded.  Requires CARGO_REGISTRY_TOKEN secret.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --dry-run -p tpt-async-core
      - run: |
          for crate in tpt-async-core tpt-async-timer tpt-async-macros \
                       tpt-async-executor tpt-async-io tpt-net-tls \
                       tpt-net-http tpt-net-ws tpt-async; do
            cargo publish -p "$crate" || exit 1
            sleep 10 # registry index propagation between dependent crates
          done
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
